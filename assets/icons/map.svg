<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- Map Parchment Canvas -->
  <rect width="320" height="320" fill="#F4EFE6"/>
  
  <!-- Watercolor Lake / Green Park Patches -->
  <path d="M20 30 Q 80 40 90 90 Q 60 140 20 120 Z" fill="#C5D6B6" opacity="0.6"/>
  <path d="M220 40 Q 280 20 300 70 Q 270 120 230 90 Z" fill="#D3DEC6" opacity="0.7"/>
  <path d="M30 200 Q 100 180 120 240 Q 80 290 30 280 Z" fill="#C1D4B1" opacity="0.65"/>
  <path d="M200 220 Q 260 200 290 250 Q 280 300 220 290 Z" fill="#C9DAB9" opacity="0.6"/>

  <!-- Waterway / Canal (Lake Pichola aesthetic) -->
  <path d="M60 320 C 80 260 120 240 140 210 C 160 180 160 140 180 110 C 200 80 220 60 230 0" stroke="#9BBEC7" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M60 320 C 80 260 120 240 140 210 C 160 180 160 140 180 110 C 200 80 220 60 230 0" stroke="#7BA8B3" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- City Grid Roads / Paths -->
  <!-- Major Arteries -->
  <path d="M0 160 Q 160 150 320 170" stroke="#E6DBCC" stroke-width="8" fill="none"/>
  <path d="M160 0 Q 170 160 150 320" stroke="#E6DBCC" stroke-width="8" fill="none"/>
  <path d="M40 40 L 280 280" stroke="#E6DBCC" stroke-width="7" fill="none"/>
  <path d="M280 40 L 40 280" stroke="#E6DBCC" stroke-width="7" fill="none"/>

  <!-- Minor Streets -->
  <path d="M0 80 Q 160 90 320 70" stroke="#EFE7DC" stroke-width="4" fill="none"/>
  <path d="M0 240 Q 160 230 320 250" stroke="#EFE7DC" stroke-width="4" fill="none"/>
  <path d="M80 0 Q 90 160 70 320" stroke="#EFE7DC" stroke-width="4" fill="none"/>
  <path d="M240 0 Q 230 160 250 320" stroke="#EFE7DC" stroke-width="4" fill="none"/>

  <!-- Palace Location Hub Radial Rings -->
  <circle cx="165" cy="155" r="22" stroke="rgba(184, 138, 50, 0.4)" stroke-width="1.5" stroke-dasharray="3 3" fill="rgba(255, 255, 255, 0.4)"/>
  <circle cx="165" cy="155" r="14" stroke="rgba(184, 138, 50, 0.6)" stroke-width="1" fill="none"/>

  <!-- Destination Map Pin -->
  <g transform="translate(165 155)">
    <!-- Pin Shadow -->
    <ellipse cx="0" cy="0" rx="8" ry="3.5" fill="rgba(41, 37, 31, 0.35)"/>
    <!-- Pin Body -->
    <path d="M0 0 C -7 -10 -11 -16 -11 -23 C -11 -30 -5 -35 0 -35 C 5 -35 11 -30 11 -23 C 11 -16 7 -10 0 0 Z" fill="#B73527" stroke="#7A1D13" stroke-width="1.2"/>
    <!-- Pin Inner Dot -->
    <circle cx="0" cy="-23" r="4.5" fill="#FFFFFF"/>
    <circle cx="0" cy="-23" r="2" fill="#B73527"/>
  </g>
</svg>
